<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="UTF-8">
<title>نرخ تتر</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin:0;
  width:260px;
  padding:22px 20px;
  font-family: -apple-system, "Segoe UI", Tahoma, Vazirmatn, Arial, sans-serif;
  background: radial-gradient(120% 120% at 50% 0%, #16213e 0%, #0b0f1a 60%, #08090f 100%);
  color:#f8fafc;
  text-align:center;
}

.title {
  font-size:13px;
  font-weight:600;
  color:#94a3b8;
  letter-spacing:.5px;
  text-transform:uppercase;
  margin-bottom:18px;
}

.card {
  background: linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:22px 16px;
  box-shadow: 0 8px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
  animation: rise .35s ease-out;
}

@keyframes rise {
  from { opacity:0; transform:translateY(6px); }
  to { opacity:1; transform:translateY(0); }
}

.small-title {
  font-size:11px;
  color:#64748b;
  margin-bottom:10px;
}

.price-row {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.coin {
  width:26px;
  height:26px;
  border-radius:50%;
  background: linear-gradient(145deg, #2dd4bf, #059669);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:800;
  color:#052e26;
  flex-shrink:0;
}

.price {
  font-size:30px;
  font-weight:800;
  color:#34d399;
  line-height:1.3;
  letter-spacing:-.5px;
}

.unit {
  font-size:13px;
  font-weight:500;
  color:#94a3b8;
  margin-right:2px;
}

.divider {
  height:1px;
  background: rgba(255,255,255,.08);
  margin:16px 0 14px;
}

.status {
  font-size:11px;
  color:#94a3b8;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.dot {
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  animation:pulse 1.6s infinite;
  flex-shrink: 0;
}

@keyframes pulse {
  0%,100% {
    opacity:1;
    box-shadow:0 0 0 0 rgba(34,197,94,.4);
  }
  50% {
    opacity:.5;
    box-shadow:0 0 0 6px rgba(34,197,94,0);
  }
}

.status-text {
  color: #4ade80;
  font-weight: 500;
}

.time {
  margin-top:10px;
  font-size:10.5px;
  color:#475569;
}

.footer {
  margin-top:18px;
  font-size:10px;
  color:#475569;
  letter-spacing:.2px;
}

</style>

</head>

<body>

<div class="title">
  نرخ تتر
</div>

<div class="card">
  <div class="small-title">
    قیمت لحظه‌ای تتر
  </div>

  <div class="price-row" id="content">
    <span class="coin">₮</span>
    <span class="price" id="price"></span>
    <span class="unit">تومان</span>
  </div>

  <div class="divider"></div>

  <div class="status">
    <span class="dot"></span>
    <span class="status-text">آنلاین</span>
  </div>

  <div class="time">
    آخرین بروزرسانی: <span id="time"></span>
  </div>
</div>

<div class="footer">
  منبع داده: ArzDigital
</div>

<script src="popup.js"></script>

</body>
</html>
